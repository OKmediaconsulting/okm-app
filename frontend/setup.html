<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OK Media Consulting — Ersteinrichtung</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f4f6f8;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.card {
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  padding: 48px 40px;
  width: 100%;
  max-width: 440px;
}
.logo { text-align: center; margin-bottom: 32px; }
.logo-mark {
  display: inline-flex; align-items: center; justify-content: center;
  width: 52px; height: 52px; background: #2563eb;
  border-radius: 12px; margin-bottom: 16px;
}
.logo-mark span { font-size: 20px; font-weight: 800; color: #fff; letter-spacing: -1px; }
.logo h1 { font-size: 18px; font-weight: 700; color: #111827; }
.logo p { font-size: 13px; color: #6b7280; margin-top: 6px; line-height: 1.5; }
.step-label {
  font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
  color: #2563eb; text-transform: uppercase; margin-bottom: 20px;
  text-align: center;
}
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 5px; }
.field input {
  width: 100%; height: 44px; padding: 0 14px;
  border: 1.5px solid #e5e7eb; border-radius: 8px;
  font-size: 15px; color: #111827; background: #fff; outline: none;
  transition: border-color 0.15s;
}
.field input:focus { border-color: #2563eb; }
.field input.error { border-color: #dc2626; }
.hint { font-size: 11px; color: #9ca3af; margin-top: 4px; }
.btn-submit {
  width: 100%; height: 48px; background: #2563eb; color: #fff;
  border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
  cursor: pointer; margin-top: 8px; transition: background 0.15s;
}
.btn-submit:hover { background: #1d4ed8; }
.btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
.error-msg {
  background: #fef2f2; border: 1px solid #fecaca; color: #dc2626;
  border-radius: 8px; padding: 10px 14px; font-size: 13px;
  margin-bottom: 14px; display: none;
}
.error-msg.show { display: block; }
.info-box {
  background: #eff6ff; border: 1px solid #bfdbfe;
  border-radius: 8px; padding: 12px 14px; font-size: 13px;
  color: #1e40af; margin-bottom: 20px; line-height: 1.5;
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark"><span>OK</span></div>
    <h1>OK Media Consulting</h1>
    <p>Willkommen. Richte jetzt deinen<br>Geschäftsführer-Account ein.</p>
  </div>

  <div class="step-label">Ersteinrichtung · Schritt 1 von 1</div>

  <div class="info-box">
    Dieser Account erhält vollständigen Zugriff auf OK Media Consulting und kann später Mitarbeiter einladen.
  </div>

  <div class="error-msg" id="err"></div>

  <form id="form" onsubmit="setup(event)">
    <div class="row">
      <div class="field">
        <label>Vorname</label>
        <input type="text" id="vorname" placeholder="Okan" autocomplete="given-name" required>
      </div>
      <div class="field">
        <label>Nachname</label>
        <input type="text" id="nachname" placeholder="..." autocomplete="family-name" required>
      </div>
    </div>
    <div class="field">
      <label>E-Mail-Adresse</label>
      <input type="email" id="email" placeholder="okan@okmediaconsulting.net"
             autocomplete="email" required>
    </div>
    <div class="field">
      <label>Passwort</label>
      <input type="password" id="password" placeholder="Mindestens 8 Zeichen"
             autocomplete="new-password" required minlength="8">
      <div class="hint">Mindestens 8 Zeichen. Wähle ein sicheres Passwort.</div>
    </div>
    <div class="field">
      <label>Passwort bestätigen</label>
      <input type="password" id="password2" placeholder="Passwort wiederholen"
             autocomplete="new-password" required>
    </div>
    <button class="btn-submit" type="submit" id="btn">Account erstellen</button>
  </form>
</div>

<script>
async function setup(e) {
  e.preventDefault();
  const vorname   = document.getElementById('vorname').value.trim();
  const nachname  = document.getElementById('nachname').value.trim();
  const email     = document.getElementById('email').value.trim();
  const password  = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;
  const btn       = document.getElementById('btn');

  if (password !== password2) {
    showError('Die Passwörter stimmen nicht überein');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Wird eingerichtet…';

  try {
    const res = await fetch('/api/auth/setup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ vorname, nachname, email, password }),
      credentials: 'include'
    });
    const data = await res.json();
    if (!res.ok) {
      showError(data.detail || 'Fehler bei der Einrichtung');
      return;
    }
    window.location.replace('/dashboard');
  } catch {
    showError('Verbindung zum Server fehlgeschlagen');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Account erstellen';
  }
}

function showError(msg) {
  const el = document.getElementById('err');
  el.textContent = msg;
  el.classList.add('show');
}

document.addEventListener('input', () => {
  document.getElementById('err').classList.remove('show');
});
</script>
</body>
</html>
