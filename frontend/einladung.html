<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Einladung — OK Media Consulting</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f4f6f8; min-height: 100vh;
  display: flex; align-items: center; justify-content: center; padding: 24px;
}
.card {
  background: #fff; border-radius: 16px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  padding: 48px 40px; width: 100%; max-width: 440px;
}
.logo { text-align: center; margin-bottom: 32px; }
.logo-mark {
  display: inline-flex; align-items: center; justify-content: center;
  width: 52px; height: 52px; background: #2563eb;
  border-radius: 12px; margin-bottom: 16px;
}
.logo-mark span { font-size: 20px; font-weight: 800; color: #fff; letter-spacing: -1px; }
.logo h1 { font-size: 18px; font-weight: 700; color: #111827; }
.logo p { font-size: 13px; color: #6b7280; margin-top: 6px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; font-weight: 500; color: #374151; margin-bottom: 5px; }
.field input {
  width: 100%; height: 44px; padding: 0 14px;
  border: 1.5px solid #e5e7eb; border-radius: 8px;
  font-size: 15px; color: #111827; background: #fff; outline: none;
  transition: border-color 0.15s;
}
.field input:focus { border-color: #2563eb; }
.hint { font-size: 11px; color: #9ca3af; margin-top: 4px; }
.btn-submit {
  width: 100%; height: 48px; background: #2563eb; color: #fff;
  border: none; border-radius: 8px; font-size: 15px; font-weight: 600;
  cursor: pointer; margin-top: 8px;
}
.btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
.error-msg {
  background: #fef2f2; border: 1px solid #fecaca; color: #dc2626;
  border-radius: 8px; padding: 10px 14px; font-size: 13px;
  margin-bottom: 14px; display: none;
}
.error-msg.show { display: block; }
.info-box {
  background: #eff6ff; border: 1px solid #bfdbfe;
  border-radius: 8px; padding: 12px 14px; font-size: 13px;
  color: #1e40af; margin-bottom: 20px; line-height: 1.5;
}
.invalid-box {
  text-align: center; padding: 32px 0;
}
.invalid-box h2 { font-size: 18px; font-weight: 700; color: #111827; margin-bottom: 8px; }
.invalid-box p { font-size: 14px; color: #6b7280; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="logo">
    <div class="logo-mark"><span>OK</span></div>
    <h1>OK Media Consulting</h1>
    <p id="subtitle">Einladung wird geprüft…</p>
  </div>
  <div id="content"></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const token = params.get('token');

if (!token) {
  showInvalid('Ungültige Einladung', 'Dieser Link ist nicht gültig.');
} else {
  showForm();
}

function showInvalid(title, msg) {
  document.getElementById('subtitle').textContent = '';
  document.getElementById('content').innerHTML = `
    <div class="invalid-box">
      <h2>${title}</h2>
      <p>${msg}</p>
    </div>`;
}

function showForm() {
  document.getElementById('subtitle').textContent = 'Erstelle deinen Account';
  document.getElementById('content').innerHTML = `
    <div class="info-box">Du wurdest eingeladen, OK Media Consulting beizutreten. Richte jetzt deinen Account ein.</div>
    <div class="error-msg" id="err"></div>
    <form id="form" onsubmit="submit(event)">
      <div class="row">
        <div class="field"><label>Vorname</label><input type="text" id="vorname" autocomplete="given-name" required></div>
        <div class="field"><label>Nachname</label><input type="text" id="nachname" autocomplete="family-name" required></div>
      </div>
      <div class="field">
        <label>Passwort</label>
        <input type="password" id="password" placeholder="Mindestens 8 Zeichen" autocomplete="new-password" required minlength="8">
        <div class="hint">Mindestens 8 Zeichen</div>
      </div>
      <div class="field">
        <label>Passwort bestätigen</label>
        <input type="password" id="password2" autocomplete="new-password" required>
      </div>
      <button class="btn-submit" type="submit" id="btn">Account erstellen</button>
    </form>`;
}

async function submit(e) {
  e.preventDefault();
  const vorname   = document.getElementById('vorname').value.trim();
  const nachname  = document.getElementById('nachname').value.trim();
  const password  = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;
  const btn       = document.getElementById('btn');
  const errEl     = document.getElementById('err');

  if (password !== password2) {
    errEl.textContent = 'Die Passwörter stimmen nicht überein';
    errEl.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Wird erstellt…';

  try {
    const res = await fetch('/api/auth/accept-invite', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, vorname, nachname, password }),
      credentials: 'include'
    });
    const data = await res.json();
    if (!res.ok) {
      errEl.textContent = data.detail || 'Fehler beim Erstellen des Accounts';
      errEl.classList.add('show');
      return;
    }
    window.location.replace('/dashboard');
  } catch {
    errEl.textContent = 'Verbindungsfehler';
    errEl.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Account erstellen';
  }
}
</script>
</body>
</html>
