<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/static/sw.js");</script>
<title>OK Media — Recherche</title>
<link rel="stylesheet" href="/static/okm.css">
<style>
:root {
  --bg:      #f4f6f8;
  --panel:   #ffffff;
  --panel2:  #f9fafb;
  --border:  #e5e7eb;
  --accent:  #2563eb;
  --accent2: #1d4ed8;
  --green:   #16a34a;
  --orange:  #d97706;
  --red:     #dc2626;
  --text:    #111827;
  --text2:   #6b7280;
  --text3:   #9ca3af;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif; min-height:100vh; }

/* ── TOPBAR ── */
#topbar {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 20px; border-bottom:1px solid var(--border);
  background:var(--panel); position:sticky; top:0; z-index:10;
}
.logo { font-size:16px; font-weight:700; color:var(--text); }
.logo span { color:var(--accent); }
.logo-sub { font-size:11px; color:var(--text2); margin-top:2px; }
.top-actions { display:flex; gap:10px; align-items:center; }

/* ── LAYOUT ── */
#app { display:flex; height:calc(100vh - 57px); }

@media (max-width: 768px) {
  body { overflow-x: hidden; }
  #app { flex-direction: column; height: auto; padding-bottom: 70px; width: 100%; max-width: 100vw; }
  #sidebar { width: 100%; max-width: 100vw; height: auto; border-right: none; border-bottom: 1px solid var(--border); flex-shrink: 0; overflow: hidden; }
  #recherche-liste { max-height: 45vh; overflow-y: auto; }
  #detail { padding: 16px; min-height: 50vh; width: 100%; max-width: 100vw; box-sizing: border-box; overflow: hidden; }
  #app.detail-open #sidebar { display: none; }
  #app.detail-open #detail { min-height: calc(100vh - 130px); }
  .d-inhalt { padding: 14px; font-size: 13px; word-break: break-word; overflow-wrap: anywhere; }
  .d-titel { font-size: 18px; }
  .quelle-link { word-break: break-all; }
  #topbar { padding: 8px 12px; }
  .logo-sub { display: none; }
  #mobile-back-rch {
    display: flex; align-items: center; gap: 6px;
    background: none; border: none; color: var(--accent);
    font-size: 14px; font-weight: 600; cursor: pointer;
    padding: 0 0 12px 0;
  }
}

/* ── SIDEBAR ── */
#sidebar {
  width:260px; flex-shrink:0; border-right:1px solid var(--border);
  background:var(--panel); display:flex; flex-direction:column; overflow:hidden;
}
#sidebar-header { padding:12px 14px; border-bottom:1px solid var(--border); flex-shrink:0; }
#search-box {
  width:100%; background:var(--panel2); border:1px solid var(--border);
  color:var(--text); font-family:inherit; font-size:13px;
  padding:8px 12px; outline:none; border-radius:5px;
}
#search-box:focus { border-color:var(--accent2); }
#search-box::placeholder { color:var(--text3); }

#themen-list { padding:8px 0; border-bottom:1px solid var(--border); flex-shrink:0; }
.thema-btn {
  display:block; width:100%; text-align:left; padding:7px 14px;
  background:none; border:none; color:var(--text2); font-size:12px;
  cursor:pointer; transition:all .15s;
}
.thema-btn:hover { color:var(--text); background:rgba(88,166,255,.05); }
.thema-btn.active { color:var(--accent); background:rgba(88,166,255,.08); border-left:2px solid var(--accent); }
.thema-count { float:right; font-size:10px; color:var(--text3); }

#recherche-liste { flex:1; overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
.recherche-item {
  padding:12px 14px; border-bottom:1px solid var(--border);
  cursor:pointer; transition:background .15s;
}
.recherche-item:hover { background:rgba(88,166,255,.04); }
.recherche-item.active { background:rgba(88,166,255,.08); border-left:2px solid var(--accent); }
.ri-titel { font-size:13px; font-weight:600; color:var(--text); margin-bottom:3px; }
.ri-thema { font-size:10px; color:var(--accent); margin-bottom:2px; }
.ri-datum { font-size:10px; color:var(--text3); }

/* ── DETAIL ── */
#detail {
  flex:1; overflow-y:auto; padding:24px 28px;
  scrollbar-width:thin; scrollbar-color:var(--border) transparent;
}

#empty-state {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:100%; gap:14px; color:var(--text2);
}
.es-icon { font-size:48px; opacity:.3; }
.es-text { font-size:13px; }

.d-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:20px; }
.d-titel { font-size:22px; font-weight:700; color:var(--text); line-height:1.3; }
.d-meta { display:flex; gap:12px; margin-top:8px; flex-wrap:wrap; }
.d-thema { font-size:11px; color:var(--accent); background:rgba(88,166,255,.1); padding:2px 10px; border-radius:10px; border:1px solid rgba(88,166,255,.3); }
.d-datum { font-size:11px; color:var(--text2); }
.d-tag { font-size:11px; color:var(--text2); background:var(--panel2); padding:2px 8px; border-radius:10px; }
.d-actions { display:flex; gap:8px; flex-shrink:0; }

.d-inhalt {
  font-size:14px; color:var(--text); line-height:1.8;
  white-space:pre-wrap; background:var(--panel); border:1px solid var(--border);
  border-radius:8px; padding:20px 24px; margin-bottom:16px;
}

.d-quellen { margin-top:16px; }
.d-quellen-titel { font-size:11px; font-weight:600; color:var(--text2); text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
.quelle-link { display:block; font-size:12px; color:var(--accent); text-decoration:none; margin-bottom:4px; }
.quelle-link:hover { text-decoration:underline; }

/* ── NEUES MODAL ── */
.modal-bg { display:none; position:fixed; inset:0; z-index:1000; background:rgba(13,17,23,.88); align-items:center; justify-content:center; }
.modal-bg.open { display:flex; }
.modal { background:var(--panel); border:1px solid var(--border); padding:24px 28px; width:560px; max-width:95vw; max-height:85vh; overflow-y:auto; position:relative; border-radius:8px; }
.modal-title { font-size:15px; font-weight:700; color:var(--text); margin-bottom:20px; }
.modal-close { position:absolute; top:16px; right:16px; background:none; border:none; color:var(--text2); cursor:pointer; font-size:18px; }
.modal-close:hover { color:var(--red); }
.form-row { margin-bottom:14px; }
.form-row label { display:block; font-size:11px; font-weight:600; color:var(--text2); margin-bottom:5px; }
.form-row input, .form-row select, .form-row textarea {
  width:100%; background:var(--panel2); border:1px solid var(--border);
  color:var(--text); font-family:inherit; font-size:13px;
  padding:9px 12px; outline:none; resize:vertical; border-radius:5px;
}
.form-row input:focus, .form-row textarea:focus { border-color:var(--accent2); }
.modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }
.url-list { display:flex; flex-direction:column; gap:6px; }
.url-row { display:flex; gap:6px; }
.url-row input { flex:1; }

/* ── BUTTONS ── */
.btn { background:transparent; border:1px solid var(--border); color:var(--text2); font-family:inherit; font-size:12px; padding:7px 16px; cursor:pointer; transition:all .2s; border-radius:5px; }
.btn:hover { border-color:var(--accent); color:var(--accent); background:rgba(88,166,255,.06); }
.btn.primary { border-color:var(--accent2); color:var(--accent); background:rgba(88,166,255,.1); }
.btn.primary:hover { background:rgba(88,166,255,.18); }
.btn.danger { border-color:rgba(248,81,73,.4); color:var(--red); }
.btn.danger:hover { background:rgba(248,81,73,.08); }
.btn.sm { padding:4px 10px; font-size:11px; }

/* Loading */
.loading { text-align:center; padding:40px; color:var(--text2); font-size:13px; }
.loading-icon { font-size:28px; margin-bottom:12px; animation:spin 2s linear infinite; display:block; }
@keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
</style>
</head>
<body>

<nav class="okm-topbar">
  <a href="/dashboard" class="okm-logo">OK <span>Media</span></a>
  <div class="okm-nav">
    <a href="/dashboard">Dashboard</a>
    <a href="/crm">CRM</a>
    <a href="/skripte">Skripte</a>
    <a href="/recherche" class="active">Recherche</a>
    <a href="/denkt-mit">Denkt mit</a>
    <a href="/team">Team</a>    <a href="/systemgesundheit">System</a>
  </div>
  <div style="display:flex;gap:8px;align-items:center;margin-left:auto">
    <button class="btn btn-secondary btn-sm" onclick="openNeu()">+ Neu</button>
    <button class="btn btn-primary btn-sm" onclick="openWebRecherche()">Web recherchieren</button>
  </div>
  <div class="okm-topbar-right" style="display:flex;align-items:center;gap:8px;margin-left:auto">
    <span id="me-name" style="font-size:12px;color:var(--muted)"></span>
    <button id="me-avatar" onclick="logout()" title="Abmelden"
      style="width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;border:none;cursor:pointer;font-size:12px;font-weight:700;flex-shrink:0">?</button>
  </div>
</nav>

<!-- MOBILE BOTTOM NAV -->
<nav class="okm-bottom-nav">
  <div class="okm-bottom-nav-inner">
    <a href="/dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>Dashboard</a>
    <a href="/crm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>CRM</a>
    <a href="/skripte"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Skripte</a>
    <a href="/recherche" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Recherche</a>
    <a href="/denkt-mit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>Denkt mit</a>
  </div>
</nav>

<div id="app">

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div id="sidebar-header">
      <input id="search-box" type="text" placeholder="Suchen…" oninput="suche(this.value)">
    </div>
    <div id="themen-list"></div>
    <div id="recherche-liste"></div>
  </div>

  <!-- DETAIL -->
  <div id="detail">
    <button id="mobile-back-rch" style="display:none" onclick="mobileBackRch()">← Zurück zur Liste</button>
    <div id="empty-state">
      <div class="es-icon">✦</div>
      <div class="es-text">Recherche auswählen oder neue erstellen</div>
    </div>
    <div id="recherche-detail" style="display:none"></div>
  </div>

</div>

<!-- MODAL: Manuelle Recherche -->
<div class="modal-bg" id="modal-neu">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('modal-neu')">✕</button>
    <div class="modal-title">Neue Recherche</div>
    <div class="form-row">
      <label>Thema *</label>
      <input id="neu-thema" type="text" placeholder="z.B. Local SEO, Wettbewerber, KI-Tools">
    </div>
    <div class="form-row">
      <label>Titel *</label>
      <input id="neu-titel" type="text" placeholder="Prägnanter Titel">
    </div>
    <div class="form-row">
      <label>Inhalt *</label>
      <textarea id="neu-inhalt" rows="8" placeholder="Erkenntnisse, Zusammenfassung, Notizen…"></textarea>
    </div>
    <div class="form-row">
      <label>Quellen (URLs, eine pro Zeile)</label>
      <textarea id="neu-quellen" rows="3" placeholder="https://…"></textarea>
    </div>
    <div class="form-row">
      <label>Tags (kommagetrennt)</label>
      <input id="neu-tags" type="text" placeholder="seo, konkurrenz, tools">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('modal-neu')">Abbrechen</button>
      <button class="btn primary" onclick="speichernManuell()">Speichern</button>
    </div>
  </div>
</div>

<!-- MODAL: Web-Recherche -->
<div class="modal-bg" id="modal-web">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('modal-web')">✕</button>
    <div class="modal-title">✦ Web recherchieren</div>

    <div id="web-step1">
      <div class="form-row">
        <label>Thema *</label>
        <input id="web-thema" type="text" placeholder="z.B. Google Business Profile Optimierung">
      </div>
      <div class="form-row">
        <label>Was möchtest du wissen?</label>
        <textarea id="web-frage" rows="3" placeholder="z.B. Welche Faktoren beeinflussen das Ranking am stärksten?"></textarea>
      </div>
      <div class="form-row">
        <label>URLs zum Lesen (bis zu 3, eine pro Zeile)</label>
        <textarea id="web-urls" rows="4" placeholder="https://…&#10;https://…"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal('modal-web')">Abbrechen</button>
        <button class="btn primary" onclick="startWebRecherche()">✦ Recherche starten</button>
      </div>
    </div>

    <div id="web-loading" style="display:none">
      <div class="loading">
        <span class="loading-icon">✦</span>
        Seiten werden gelesen und Zusammenfassung wird erstellt…
      </div>
    </div>
  </div>
</div>

<script>
let aktuelleRecherche = null;
let aktivesThema = '';
let suchTimer = null;

async function api(url, method='GET', body=null) {
  const opts = { method, headers:{'Content-Type':'application/json'} };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error(`${r.status}`);
  return r.json();
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  await loadThemen();
  await loadListe();
}

// ── Themen ────────────────────────────────────────────────────────────────────
async function loadThemen() {
  const themen = await api('/api/recherche/themen');
  const el = document.getElementById('themen-list');
  el.innerHTML = `<button class="thema-btn ${aktivesThema===''?'active':''}" onclick="filterThema('')">Alle <span class="thema-count">${themen.reduce((s,t)=>s+t.anzahl,0)}</span></button>` +
    themen.map(t => `<button class="thema-btn ${aktivesThema===t.thema?'active':''}" onclick="filterThema('${esc(t.thema)}')">${esc(t.thema)} <span class="thema-count">${t.anzahl}</span></button>`).join('');
}

function filterThema(thema) {
  aktivesThema = thema;
  loadThemen();
  loadListe();
}

// ── Liste ─────────────────────────────────────────────────────────────────────
async function loadListe(suche='') {
  const items = await api(`/api/recherche?suche=${encodeURIComponent(suche)}&thema=${encodeURIComponent(aktivesThema)}`);
  const el = document.getElementById('recherche-liste');
  if (!items.length) {
    el.innerHTML = '<div style="padding:20px 14px;font-size:12px;color:var(--text3)">Keine Einträge</div>';
    return;
  }
  el.innerHTML = items.map(r => `
    <div class="recherche-item ${aktuelleRecherche?.id===r.id?'active':''}" onclick="loadDetail(${r.id})">
      <div class="ri-thema">${esc(r.thema)}</div>
      <div class="ri-titel">${esc(r.titel)}</div>
      <div class="ri-datum">${r.erstellt_am.substring(0,10)}</div>
    </div>`).join('');
}

function suche(val) {
  clearTimeout(suchTimer);
  suchTimer = setTimeout(() => loadListe(val), 300);
}

// ── Detail ────────────────────────────────────────────────────────────────────
async function loadDetail(rid) {
  const r = await api(`/api/recherche/${rid}`);
  aktuelleRecherche = r;
  loadListe(document.getElementById('search-box').value);

  document.getElementById('empty-state').style.display = 'none';
  const d = document.getElementById('recherche-detail');
  d.style.display = 'block';

  const quellen = (r.quellen||'').split('\n').filter(q=>q.trim());
  const tags = (r.tags||'').split(',').filter(t=>t.trim());

  if (window.innerWidth <= 768) {
    document.getElementById('app').classList.add('detail-open');
    document.getElementById('mobile-back-rch').style.display = 'flex';
    window.scrollTo(0, 0);
  }

  d.innerHTML = `
    <div class="d-header">
      <div>
        <div class="d-titel">${esc(r.titel)}</div>
        <div class="d-meta">
          <span class="d-thema">${esc(r.thema)}</span>
          <span class="d-datum">${r.erstellt_am.substring(0,16).replace('T',' ')}</span>
          ${tags.map(t=>`<span class="d-tag">${esc(t.trim())}</span>`).join('')}
        </div>
      </div>
      <div class="d-actions">
        <button class="btn sm" onclick="openBearbeiten(${r.id})">✎ Bearbeiten</button>
        <button class="btn sm danger" onclick="loeschen(${r.id})">✕</button>
      </div>
    </div>

    <div class="d-inhalt">${esc(r.inhalt)}</div>

    ${quellen.length ? `<div class="d-quellen">
      <div class="d-quellen-titel">Quellen</div>
      ${quellen.map(q=>`<a class="quelle-link" href="${esc(q)}" target="_blank">${esc(q)}</a>`).join('')}
    </div>` : ''}
  `;
}

function mobileBackRch() {
  document.getElementById('app').classList.remove('detail-open');
  document.getElementById('mobile-back-rch').style.display = 'none';
}

// ── Neue Recherche (manuell) ──────────────────────────────────────────────────
function openNeu() {
  document.getElementById('neu-thema').value = '';
  document.getElementById('neu-titel').value = '';
  document.getElementById('neu-inhalt').value = '';
  document.getElementById('neu-quellen').value = '';
  document.getElementById('neu-tags').value = '';
  document.getElementById('modal-neu').classList.add('open');
  document.getElementById('neu-thema').focus();
}

async function speichernManuell() {
  const thema = document.getElementById('neu-thema').value.trim();
  const titel = document.getElementById('neu-titel').value.trim();
  const inhalt = document.getElementById('neu-inhalt').value.trim();
  if (!thema || !titel || !inhalt) { alert('Thema, Titel und Inhalt sind Pflichtfelder.'); return; }
  const r = await api('/api/recherche', 'POST', {
    thema, titel, inhalt,
    quellen: document.getElementById('neu-quellen').value.trim(),
    tags: document.getElementById('neu-tags').value.trim(),
  });
  closeModal('modal-neu');
  await loadThemen();
  await loadListe();
  await loadDetail(r.id);
}

// ── Web-Recherche ─────────────────────────────────────────────────────────────
function openWebRecherche() {
  document.getElementById('web-thema').value = '';
  document.getElementById('web-frage').value = '';
  document.getElementById('web-urls').value = '';
  document.getElementById('web-step1').style.display = 'block';
  document.getElementById('web-loading').style.display = 'none';
  document.getElementById('modal-web').classList.add('open');
  document.getElementById('web-thema').focus();
}

async function startWebRecherche() {
  const thema = document.getElementById('web-thema').value.trim();
  const frage = document.getElementById('web-frage').value.trim();
  const urlsRaw = document.getElementById('web-urls').value.trim();
  if (!thema) { alert('Bitte ein Thema eingeben.'); return; }
  const urls = urlsRaw ? urlsRaw.split('\n').map(u=>u.trim()).filter(Boolean) : [];

  document.getElementById('web-step1').style.display = 'none';
  document.getElementById('web-loading').style.display = 'block';

  try {
    const result = await api('/api/recherche/web', 'POST', { thema, frage, urls });
    closeModal('modal-web');
    await loadThemen();
    await loadListe();
    await loadDetail(result.id);
  } catch(e) {
    document.getElementById('web-loading').style.display = 'none';
    document.getElementById('web-step1').style.display = 'block';
    alert('Fehler: ' + e.message);
  }
}

// ── Bearbeiten ────────────────────────────────────────────────────────────────
function openBearbeiten(rid) {
  const r = aktuelleRecherche;
  document.getElementById('neu-thema').value = r.thema;
  document.getElementById('neu-titel').value = r.titel;
  document.getElementById('neu-inhalt').value = r.inhalt;
  document.getElementById('neu-quellen').value = r.quellen || '';
  document.getElementById('neu-tags').value = r.tags || '';
  // Speichern-Button umschalten
  const btn = document.querySelector('#modal-neu .btn.primary');
  btn.textContent = 'Aktualisieren';
  btn.onclick = async () => {
    await api(`/api/recherche/${rid}`, 'PUT', {
      thema: document.getElementById('neu-thema').value.trim(),
      titel: document.getElementById('neu-titel').value.trim(),
      inhalt: document.getElementById('neu-inhalt').value.trim(),
      quellen: document.getElementById('neu-quellen').value.trim(),
      tags: document.getElementById('neu-tags').value.trim(),
    });
    btn.textContent = 'Speichern';
    btn.onclick = speichernManuell;
    closeModal('modal-neu');
    await loadThemen();
    await loadListe();
    await loadDetail(rid);
  };
  document.getElementById('modal-neu').classList.add('open');
}

// ── Löschen ───────────────────────────────────────────────────────────────────
async function loeschen(rid) {
  if (!confirm('Recherche wirklich löschen?')) return;
  await api(`/api/recherche/${rid}`, 'DELETE');
  aktuelleRecherche = null;
  document.getElementById('empty-state').style.display = 'flex';
  document.getElementById('recherche-detail').style.display = 'none';
  await loadThemen();
  await loadListe();
}

// Escape schließt Modal
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.modal-bg.open').forEach(m=>m.classList.remove('open'));
});

init();
</script>
<script>
(async function() {
  try {
    const res = await fetch("/api/auth/me", { credentials: "include" });
    if (!res.ok) { window.location.replace("/login"); return; }
    const u = await res.json();
    const nameEl = document.getElementById("me-name");
    const avatarEl = document.getElementById("me-avatar");
    if (nameEl) nameEl.textContent = u.vorname;
    if (avatarEl) { avatarEl.textContent = (u.vorname?.[0]||"")+(u.nachname?.[0]||""); }
  } catch { window.location.replace("/login"); }
})();
async function logout() {
  await fetch("/api/auth/logout", { method: "POST", credentials: "include" });
  window.location.replace("/login");
}
</script>
